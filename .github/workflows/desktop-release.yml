name: Desktop app release

# Builds the operator desktop app for Windows, macOS and Linux and attaches the
# installers to a GitHub release, so a non-technical operator downloads a file
# and double-clicks it instead of building from source.
#
# Push a tag to cut a release:
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# Or run it manually from the Actions tab to produce unattached build artifacts
# for testing.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build installers without creating a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
            # Built on 22.04 rather than latest so the AppImage's glibc floor
            # stays low enough for older operator machines.
          - platform: macos-14
            label: macos-arm64
            target: aarch64-apple-darwin
          # Intel Macs are cross-compiled on the arm64 runner. GitHub retired
          # the macos-13 Intel image, and a job pinned to it sat queued for
          # 24 hours until it was cancelled, taking the whole release with it.
          - platform: macos-14
            label: macos-x86_64
            target: x86_64-apple-darwin
          - platform: windows-latest
            label: windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          # Keyed by label, not runner: both Mac builds share macos-14.
          key: ${{ matrix.label }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - name: Check formatting and lints
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Signing is wired up but optional. With the secrets absent the build
      # still succeeds and produces unsigned installers; add the secrets later
      # and the same workflow starts signing with no further changes.
      - name: Build installers
        shell: bash
        working-directory: desktop
        env:
          # macOS signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing
          TAURI_WINDOWS_SIGNING_certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_WINDOWS_SIGNING_certificate_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          # An absent GitHub secret arrives as an empty string, not as an unset
          # variable, and Tauri treats a defined-but-empty signing variable as
          # "signing requested" - then fails importing an empty certificate.
          # Drop the empties so an unsigned build genuinely stays unsigned.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                     TAURI_WINDOWS_SIGNING_certificate \
                     TAURI_WINDOWS_SIGNING_certificate_PASSWORD; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          # The cargo cache restores target/, including bundles from earlier
          # versions. Clear them so only this build's installers get collected.
          rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
          if [ -n "$TARGET" ]; then
            cargo tauri build --target "$TARGET"
          else
            cargo tauri build
          fi

      - name: Collect installers
        shell: bash
        # Host builds land in target/release/bundle, cross builds in
        # target/<triple>/release/bundle.
        working-directory: desktop/src-tauri/target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Only ship the artifacts an operator can actually double-click.
          find . -path "*release/bundle/*" -type f \
            \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \
               -o -name "*-setup.exe" -o -name "*.msi" \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: havnai-node-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            ## HavnAI Node — desktop app

            Download the file for your system, open it, enter your wallet address
            and click **Install**. The app sets up the node, downloads model
            weights, and tells you when it is ready to serve jobs.

            | System | File |
            | --- | --- |
            | Windows | `*-setup.exe` |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux (Ubuntu/Debian) | `*.deb` |
            | Linux (other) | `*.AppImage` |

            Verify a download against `SHA256SUMS.txt` if you want to.

            **First launch.** These builds are not yet signed with a paid
            developer certificate, so your system will warn you the first time:

            - **macOS** — right-click the app and choose *Open*, then *Open*
              again. Double-clicking will not work until you have done this once.
            - **Windows** — SmartScreen shows "Windows protected your PC".
              Click *More info*, then *Run anyway*.

            Prefer the terminal? See
            [docs/RUN_A_NODE.md](https://github.com/marcusllittle/havnai-core/blob/main/docs/RUN_A_NODE.md).
