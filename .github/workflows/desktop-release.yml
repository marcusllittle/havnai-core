name: Desktop app release

# Builds the operator desktop app for Windows, macOS and Linux and attaches the
# installers to a GitHub release, so a non-technical operator downloads a file
# and double-clicks it instead of building from source.
#
# Push a desktop-v* tag to publish a release. Manual runs only upload
# Actions artifacts, even when the ref selected for the run is a tag.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: "Sign and notarize the Mac test artifacts (does not publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
            # Built on 22.04 rather than latest so the AppImage's glibc floor
            # stays low enough for older operator machines.
          - platform: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
          # Cross-compile Intel on the ARM runner, as before. GitHub retired
          # macos-14 on November 2, 2026.
          - platform: macos-15
            label: macos-x86_64
            target: x86_64-apple-darwin
          - platform: windows-latest
            label: windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    timeout-minutes: 90
    env:
      # All tag-triggered Mac builds require signing; unsigned manual builds
      # never reach the release job.
      MACOS_RELEASE: ${{ matrix.target != '' && (github.event_name == 'push' || inputs.notarize_macos) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          # Keyed by label, not runner: both Mac builds share macos-15.
          key: ${{ matrix.label }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - name: Check formatting and lints
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version 2.12.5 --locked

      - name: Install Tauri CLI (Linux and Windows)
        if: runner.os != 'macOS'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Unit-test macOS release checks
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s desktop/scripts -p test_macos_release.py

      - name: Check macOS signing and notarization configuration
        if: env.MACOS_RELEASE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 desktop/scripts/macos_release.py preflight

      - name: Build installers
        shell: bash
        working-directory: desktop
        env:
          # Tauri signs the app and DMG. Notarize the outer DMG once below.
          APPLE_CERTIFICATE: ${{ env.MACOS_RELEASE == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.MACOS_RELEASE == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.MACOS_RELEASE == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          TAURI_WINDOWS_SIGNING_certificate: ${{ matrix.label == 'windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          TAURI_WINDOWS_SIGNING_certificate_PASSWORD: ${{ matrix.label == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          # Empty GitHub secrets must not request signing in local-test builds.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     TAURI_WINDOWS_SIGNING_certificate \
                     TAURI_WINDOWS_SIGNING_certificate_PASSWORD; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          # The cargo cache can restore bundles from older builds.
          rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
          if [ -n "$TARGET" ]; then
            cargo tauri build --target "$TARGET"
          else
            cargo tauri build
          fi

      - name: Notarize, staple and verify the exact macOS installer
        if: env.MACOS_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: python3 desktop/scripts/macos_release.py notarize "$TARGET"

      - name: Collect installers
        shell: bash
        # Host builds land in target/release/bundle, cross builds in
        # target/<triple>/release/bundle.
        working-directory: desktop/src-tauri/target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Only ship the artifacts an operator can actually double-click.
          find . -path "*release/bundle/*" -type f \
            \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \
               -o -name "*-setup.exe" -o -name "*.msi" \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: havnai-node-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          mkdir -p dist
          shopt -s nullglob
          arm=(artifacts/havnai-node-macos-arm64/*_aarch64.dmg)
          intel=(artifacts/havnai-node-macos-x86_64/*_x64.dmg)
          all_dmgs=(artifacts/*/*.dmg)
          if (( ${#arm[@]} != 1 || ${#intel[@]} != 1 || ${#all_dmgs[@]} != 2 )); then
            echo "Expected exactly one verified DMG for each Mac architecture" >&2
            exit 1
          fi
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            ## HavnAI Node — desktop app

            Download the file for your system, open it, enter your wallet address
            and click **Install**. The app sets up the node, downloads model
            weights, and tells you when it is ready to serve jobs.

            | System | File |
            | --- | --- |
            | Windows | `*-setup.exe` |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux (Ubuntu/Debian) | `*.deb` |
            | Linux (other) | `*.AppImage` |

            Verify a download against `SHA256SUMS.txt` if you want to.

            **macOS:** Open the matching DMG, drag HavnAI Node to Applications,
            then open it normally. Both DMGs are Developer ID signed and
            notarized. If macOS blocks the app, stop and report the filename
            and error rather than changing macOS security settings.

            **Windows:** Published builds may be unsigned; Windows SmartScreen
            may warn. Confirm the download came from this release first.

            Prefer the terminal? See
            [docs/RUN_A_NODE.md](https://github.com/marcusllittle/havnai-core/blob/main/docs/RUN_A_NODE.md).
