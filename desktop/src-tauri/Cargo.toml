[package]
name = "havnai-node-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Install, diagnose and operate a HavnAI GPU node"
authors = ["HavnAI"]
license = "MIT"

[lib]
name = "havnai_node_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
